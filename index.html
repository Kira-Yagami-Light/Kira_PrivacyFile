<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">隐私政策 - 像集</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600&family=Noto+Sans+SC:wght@300;400;500&display=swap');

    :root {
      --teal-deep: #00838F;
      --teal-mid: #4DD0E1;
      --teal-light: #B2EBF2;
      --ink: #1a2a2e;
      --ink-soft: #3d5a60;
      --ink-faint: #6b8e93;
      --bg: #f7fbfc;
      --surface: #ffffff;
      --border: #d4edf1;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.8;
      font-size: 15px;
    }

    /* Header */
    header {
      background: linear-gradient(135deg, var(--teal-deep) 0%, var(--teal-mid) 60%, var(--teal-light) 100%);
      padding: 60px 24px 48px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    header::before {
      content: '';
      position: absolute;
      top: -60px; right: -60px;
      width: 200px; height: 200px;
      border-radius: 50%;
      background: rgba(255,255,255,0.08);
    }

    header::after {
      content: '';
      position: absolute;
      bottom: -40px; left: -40px;
      width: 150px; height: 150px;
      border-radius: 50%;
      background: rgba(255,255,255,0.06);
    }

    .app-icon {
      width: 80px; height: 80px;
      border-radius: 20px;
      margin: 0 auto 16px;
      display: block;
      box-shadow: 0 8px 24px rgba(0,0,0,0.22);
    }

    header h1 {
      font-family: 'Noto Serif SC', serif;
      font-size: 26px;
      font-weight: 600;
      color: #fff;
      letter-spacing: 0.02em;
      margin-bottom: 6px;
    }

    header .subtitle {
      font-size: 13px;
      color: rgba(255,255,255,0.75);
      letter-spacing: 0.05em;
    }

    /* Update date bar */
    .update-bar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 12px 24px;
      text-align: center;
      font-size: 12px;
      color: var(--ink-faint);
      letter-spacing: 0.03em;
    }

    .update-bar span {
      color: var(--teal-deep);
      font-weight: 500;
    }

    /* Main content */
    main {
      max-width: 740px;
      margin: 0 auto;
      padding: 32px 20px 60px;
    }

    /* Summary card */
    .summary-card {
      background: linear-gradient(135deg, #e8f8fa 0%, #f0fdfe 100%);
      border: 1px solid var(--teal-light);
      border-left: 4px solid var(--teal-mid);
      border-radius: 12px;
      padding: 20px 22px;
      margin-bottom: 32px;
    }

    .summary-card p {
      font-size: 14px;
      color: var(--ink-soft);
      line-height: 1.9;
    }

    .summary-card strong {
      color: var(--teal-deep);
    }

    /* Badges */
    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: white;
      border: 1px solid var(--teal-light);
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 12px;
      color: var(--teal-deep);
      font-weight: 500;
    }

    .badge::before {
      content: '✓';
      font-size: 11px;
      color: var(--teal-mid);
    }

    /* Section */
    section {
      margin-bottom: 28px;
    }

    .section-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }

    .section-num {
      width: 26px; height: 26px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--teal-deep), var(--teal-mid));
      color: white;
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    h2 {
      font-family: 'Noto Serif SC', serif;
      font-size: 17px;
      font-weight: 600;
      color: var(--ink);
      letter-spacing: 0.01em;
    }

    p {
      color: var(--ink-soft);
      margin-bottom: 10px;
      font-size: 14.5px;
    }

    /* Permission table */
    .perm-table {
      width: 100%;
      border-collapse: collapse;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--border);
      font-size: 13.5px;
      margin-bottom: 8px;
    }

    .perm-table th {
      background: linear-gradient(90deg, var(--teal-deep), #00acc1);
      color: white;
      padding: 10px 14px;
      text-align: left;
      font-weight: 500;
      font-size: 12.5px;
      letter-spacing: 0.04em;
    }

    .perm-table td {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      color: var(--ink-soft);
      vertical-align: top;
    }

    .perm-table tr:last-child td { border-bottom: none; }
    .perm-table tr:nth-child(even) td { background: #f7fbfc; }

    .perm-name {
      font-weight: 500;
      color: var(--ink);
      white-space: nowrap;
    }

    /* Highlight box */
    .highlight-box {
      background: #fff8e1;
      border: 1px solid #ffe082;
      border-left: 4px solid #ffc107;
      border-radius: 8px;
      padding: 14px 16px;
      font-size: 13.5px;
      color: #5d4037;
      margin-top: 10px;
    }

    /* Contact */
    .contact-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px 20px;
    }

    .contact-box p { margin-bottom: 6px; }

    .contact-box a {
      color: var(--teal-deep);
      text-decoration: none;
      font-weight: 500;
    }

    .contact-box a:hover { text-decoration: underline; }

    /* Footer */
    footer {
      text-align: center;
      padding: 24px;
      font-size: 12px;
      color: var(--ink-faint);
      border-top: 1px solid var(--border);
    }

    @media (max-width: 480px) {
      header { padding: 44px 16px 36px; }
      header h1 { font-size: 22px; }
      main { padding: 24px 16px 48px; }
      .perm-table { font-size: 12.5px; }
    }
  </style>
  <style>
    .lang-bar {
      background: var(--teal-deep);
      padding: 8px 20px;
      display: flex;
      justify-content: flex-end;
      gap: 6px;
    }
    .lang-btn {
      display: inline-block;
      padding: 3px 12px;
      border-radius: 14px;
      font-size: 12px;
      color: rgba(255,255,255,0.75);
      cursor: pointer;
      text-decoration: none;
      border: 1px solid rgba(255,255,255,0.25);
      transition: all 0.2s;
      letter-spacing: 0.04em;
    }
    .lang-btn:hover, .lang-btn.active {
      background: rgba(255,255,255,0.18);
      color: #fff;
      border-color: rgba(255,255,255,0.55);
    }
    @media (max-width: 480px) {
      .lang-bar { padding: 8px 12px; }
    }
  </style>
</head>

<div class="lang-bar">
  <a class="lang-btn" data-lang="zh-CN" href="#">简体中文</a>
  <a class="lang-btn" data-lang="zh-TW" href="#">繁體中文</a>
  <a class="lang-btn" data-lang="en"    href="#">English</a>
</div>

function applyLang(lang) {
  const t = I18N[lang] || I18N['zh-CN'];
  document.documentElement.lang = lang;
  document.title = t.pageTitle;
  document.getElementById('header-title').textContent = t.headerTitle;
  document.getElementById('header-subtitle').textContent = t.headerSubtitle;
  document.getElementById('update-bar').innerHTML = t.updateBar;

  // badges
  const badgeHtml = t.badges.map(b => `<span class="badge">${b}</span>`).join('');
  // main
  let sectionsHtml = t.sections.map((s, i) => `
    <section>
      <div class="section-header">
        <div class="section-num">${i+1}</div>
        <h2>${s.title}</h2>
      </div>
      ${s.content}
    </section>`).join('');

  document.getElementById('main-content').innerHTML = `
    <div class="summary-card">
      <p>${t.summaryText}</p>
      <div class="badges">${badgeHtml}</div>
    </div>
    ${sectionsHtml}`;

  document.getElementById('footer').innerHTML = t.footer;

  // update active button
  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.lang === lang);
  });





}

document.querySelectorAll('.lang-btn').forEach(btn => {
  btn.addEventListener('click', e => {
    e.preventDefault();
    applyLang(btn.dataset.lang);
  });
});

// Init: read lang from URL param, default zh-CN
const params = new URLSearchParams(window.location.search);
const initLang = params.get('lang') || 'zh-CN';
applyLang(initLang);
</script>
